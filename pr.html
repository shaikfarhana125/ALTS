<!DOCTYPE html>
<html>
<head>
<style>
.container{
    display: flex;
    gap: 20px;   /* space between boxes */
}

.box{
    width: 150px;
    height: 150px;
    background-color: purple;
    border-radius: 10px;
    color: black;
    display: flex;
    justify-content: center;
    align-items: center;
}
</style>
</head>

<body>

<div class="container">
    <div class="box">HEAD1</div>
    <div class="box">HEAD2</div>
    <div class="box">HEAD3</div>
</div>

</body>
</html>
